<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Baptiste Lerat" />
  <title>blerat</title>
  <link rel="stylesheet" href="src/main.css" />
</head>
<body>
  <main>
    <h1 class="title">blerat.com</h1>

    <nav class="header">
      <ul>
        <li><a href="index.html" aria-current="page">Home</a></li>
        <li><a href="pages/projects.html">Projects</a></li>
        <li><a href="pages/blog.html">Blog</a></li>
        <li><a href="pages/resume.html">Resume</a></li>
      </ul>
    </nav>

    <div class="content">
      <div class="intro">
        <img class="portrait" src="media/pp.png" alt="Baptiste Lerat" width="200" height="200" data-sound="media/work-work.mp3" title="click me" />
        <p>
          I am a PhD student in physics at the University of Cambridge. I work on
          cold atoms experiments in optical lattices to study many-body phenomena.
        </p>
      </div>

      <ul class="contact">
        <li><a href="https://github.com/balerat">github</a></li>
        <li><a href="https://www.youtube.com/@balerat">youtube</a></li>
        <li><a href="https://www.linkedin.com/in/baptiste-lerat/">linkedin</a></li>
        <li><a href="https://www.manybody.phy.cam.ac.uk/">MBQD</a></li>
      </ul>
    </div>
  </main>

  <script src="src/mla-bg.js"></script>
  <script>
    document.fonts.ready.then(function () {
      var css = getComputedStyle(document.documentElement);
      MLABackground({
        offsetX: 0.34,
        offsetY: 0.36,
        fill: 0.46,
        opacity: 0.22,
        fontSize: 10,
        color: css.getPropertyValue('--color').trim(),
        fontFamily: css.getPropertyValue('--mla-font').trim()
      });
    });
  </script>
  <script>
  document.querySelectorAll('[data-sound]').forEach(function (el) {
    var audio = new Audio(el.dataset.sound);
    el.classList.add('clickable');
    el.addEventListener('click', function () {
      audio.currentTime = 0;
      audio.play().catch(function () {});
    });
  });
</script>
</body>
</html>
